<!doctype html>
<html lang="en" style="background-color: #020617; color: #f8fafc;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/BTLogo.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/BTLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" content="#020617" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Smart-Ledger</title>
  <meta name="description" content="Smart Ledger Billing, Customer Ledger, Inventory &amp; GST Management Platform" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    #app-initial-loader {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }

    .loader-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(249, 115, 22, 0.15);
      border-left-color: #f97316;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body style="background-color: #020617; color: #f8fafc;">
  <div id="root">
    <!-- Immediate Inline Loading Screen (Prevents White Flash on Mobile) -->
    <div id="app-initial-loader">
      <div class="loader-spinner"></div>
      <div
        style="font-size: 1.125rem; font-weight: 800; color: #f8fafc; letter-spacing: 0.05em; text-transform: uppercase;">
        BHARATAMBE TRADERS
      </div>
      <div
        style="font-size: 0.75rem; color: #f97316; font-weight: 700; margin-top: 0.25rem; letter-spacing: 0.1em; text-transform: uppercase;">
        Smart Ledger Mobile Console
      </div>
      <div style="font-size: 0.7rem; color: #64748b; margin-top: 1.5rem;">
        Loading portal modules...
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
